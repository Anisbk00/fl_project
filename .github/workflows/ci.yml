name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Unit tests and the build need no secrets.
      # The gated Supabase RLS integration suite skips automatically when
      # Supabase env is absent (it runs in the supabase-rls-tests job below).
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: Music Project Store
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (committed lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Unit tests + gated Supabase RLS suite
        run: bun test

      - name: Production build
        run: bun run build

  # Applies every migration to a FRESH local Supabase (proves 0001..N apply
  # cleanly in order), then runs the pgTAP + JS RLS suites. A failure here
  # blocks the merge.
  supabase-rls-tests:
    name: Supabase migrations + RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start local Supabase and apply all migrations
        run: supabase start
      - name: Export local keys for the JS suite
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"
      - name: pgTAP database tests
        run: supabase db test
      - name: JS RLS integration suite
        run: bun run test:db
