name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, type-check, unit & DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # SQLite in CI needs no server; the placeholder home page needs no secrets.
      DATABASE_URL: file:./db/ci.db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: Music Project Store
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (committed lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Generate database TypeScript types
        run: bun run db:generate

      - name: Push schema to CI SQLite DB
        run: bun run db:push

      - name: Unit & DB-backed access-matrix tests
        run: bun test

  # Production Supabase migrations + pgTAP RLS tests.
  # Requires Docker + the Supabase CLI local-container flow. Skipped in this
  # sandbox; enable on a CI runner that has Docker available.
  supabase-rls-tests:
    name: Supabase migrations + pgTAP RLS tests (requires Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Reset local DB and apply migrations
        run: supabase db reset
      - name: Run pgTAP database tests
        run: supabase db test
